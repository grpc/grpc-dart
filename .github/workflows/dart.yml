name: Dart

on:
  # Run CI on pushes to the master branch, and on PRs against master.
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 0 * * 0"

jobs:
  # Check code formatting and static analysis on a single OS (linux)
  # against Dart dev.
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [stable, dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: ${{ matrix.sdk }}
      - name: Report version
        run: dart --version
      - name: Install dependencies
        run: dart pub get
      - name: Check formatting (using dev dartfmt release)
        if: ${{ matrix.sdk == 'stable' }}
        run: dart format --output=none --set-exit-if-changed .
      - name: Check that test certificates match test/data/README.md
        if: ${{ matrix.sdk == 'stable' }}
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          cp test/data/localhost.key "$tmp/"
          sed -n '/^```sh$/,/^```$/{ /^```/d; p; }' test/data/README.md | (cd "$tmp" && bash -euo pipefail)
          diff -u "$tmp/localhost.crt" test/data/localhost.crt
          # PKCS#12 export uses random salts/IVs, so verify MAC and compare the
          # decrypted structure, attributes, cert, and key, plus DER byte length.
          openssl pkcs12 -legacy -in "$tmp/certstore.p12" -passin pass:correct -info -noenc > "$tmp/expected.pem" 2> "$tmp/expected.info"
          openssl pkcs12 -legacy -in test/data/certstore.p12 -passin pass:correct -info -noenc > "$tmp/actual.pem" 2> "$tmp/actual.info"
          diff -u "$tmp/expected.info" "$tmp/actual.info"
          diff -u "$tmp/expected.pem" "$tmp/actual.pem"
          test "$(wc -c < test/data/certstore.p12)" -eq "$(wc -c < "$tmp/certstore.p12")"
      - name: Analyze code
        run: dart analyze --fatal-infos .
      - name: Check that grpc-web sample builds with DDC
        if: ${{ matrix.sdk == 'dev' }}
        # build_runner build --no-release to force compilation with DDC.
        run: |
          pushd example/grpc-web
          rm -rf build
          dart pub run build_runner build --no-release -o web:build
          test -f ./build/main.dart.js
          popd

  # Run tests on a matrix consisting of three dimensions:
  # 1. OS: mac, windows, linux
  # 2. release channel: dev
  # 3. TODO: Dart execution mode: native, web
  test:
    needs: analyze
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [stable, dev]
        platform: [vm, chrome]
        exclude:
          # We only run Chrome tests on Linux. No need to run them
          # on Windows and Mac because they are platform independent.
          - os: windows-latest
            platform: chrome
          - os: macos-latest
            platform: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: ${{ matrix.sdk }}
      - name: Report version
        run: dart --version
      - name: Install envoy
        if: ${{ matrix.platform == 'chrome' }}
        run: |
          ENVOY_VERSION="1.19.0"
          wget https://archive.tetratelabs.io/envoy/download/v${ENVOY_VERSION}/envoy-v${ENVOY_VERSION}-linux-amd64.tar.xz
          tar -xf envoy-v${ENVOY_VERSION}-linux-amd64.tar.xz
          chmod +x envoy-v${ENVOY_VERSION}-linux-amd64/bin/envoy
          sudo mv envoy-v${ENVOY_VERSION}-linux-amd64/bin/envoy /usr/bin/envoy
          rm -rf envoy-v${ENVOY_VERSION}-linux-amd64.tar.xz envoy-v${ENVOY_VERSION}-linux-amd64
        env:
          MATRIX_OS: ${{ matrix.os }}
        shell: bash
      - name: Install dependencies
        run: dart pub get
      - name: Run tests
        run: dart test --platform ${{ matrix.platform }}
      - name: Run vmservice test
        if: ${{ matrix.platform != 'chrome' }}
        run: dart run --enable-vm-service --timeline-streams=Dart test/timeline_test.dart 
